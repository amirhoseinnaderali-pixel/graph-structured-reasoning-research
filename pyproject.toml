[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-structured-reasoning-research"
version = "0.1.0"
description = "Controlled graph-structured aggregation experiments for reasoning candidates"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "networkx>=3.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
real = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
